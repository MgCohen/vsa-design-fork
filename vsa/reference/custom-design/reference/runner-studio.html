<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Runner Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&family=Inter:wght@400;500;600;700&family=Manrope:wght@500;700;800&family=DM+Sans:wght@400;500;700&family=Sora:wght@400;600;700&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Studio page. Theme tokens for the widget are set on each .w element by JS. */
:root {
  --bg: #eef0f3; --panel: #ffffff; --fg: #171a21; --fg2: #4b5263; --line: #d9dde4; --ok: #1d7a3a; --no: #b3261e;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121417; --panel: #1b1e23; --fg: #eceef2; --fg2: #a3aab8; --line: #2c313a; --ok: #7fd18f; --no: #f59a9a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121417; --panel: #1b1e23; --fg: #eceef2; --fg2: #a3aab8; --line: #2c313a; --ok: #7fd18f; --no: #f59a9a; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 Inter, system-ui, "Segoe UI", sans-serif; }
main { padding: 20px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left)); }
h1 { font-size: 18px; margin: 0 0 4px; }
.lede { margin: 0 0 16px; color: var(--fg2); max-width: 70ch; }

.st-top { display: grid; grid-template-columns: auto minmax(260px, 380px); gap: 20px; align-items: start; justify-content: start; }
.st-hero { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.st-ctls { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow-y: auto; scrollbar-width: thin; }
.st-all { margin-top: 12px; padding-top: 16px; border-top: 1px solid var(--line); }
.frames { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
figure { margin: 0; flex: none; }
figcaption { font-size: 12px; color: var(--fg2); margin-top: 6px; }
.zoom { zoom: var(--z, .5); }
@media (max-width: 760px) {
  .st-top { grid-template-columns: minmax(0, 1fr); }
  .st-ctls { height: auto !important; }
  .st-hero { justify-content: center; }
  .st-all { margin-top: 24px; }
}

/* Controls */
details.sec { border-bottom: 1px solid var(--line); }
details.sec:last-child { border-bottom: 0; }
details.sec > summary { cursor: pointer; padding: 11px 14px; font-weight: 600; font-size: 13px; list-style: none; display: flex; align-items: center; gap: 8px; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::before { content: "▸"; color: var(--fg2); font-size: 11px; transition: transform .15s; }
details.sec[open] > summary::before { transform: rotate(90deg); }
details.sec > summary .hint { margin-left: auto; font-weight: 400; color: var(--fg2); font-size: 12px; }
.sec-b { padding: 0 14px 14px; display: grid; gap: 10px; }
.f { display: grid; gap: 4px; min-width: 0; }
.f > span { font-size: 12px; color: var(--fg2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
select, input[type="text"], button, textarea { font: inherit; font-size: 13px; color: var(--fg); }
select, input[type="text"] { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; min-width: 0; }
button { background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; cursor: pointer; }
button:hover { border-color: var(--fg2); }
button.on { background: var(--fg); color: var(--panel); border-color: var(--fg); }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.seg-c { display: flex; gap: 6px; }
.seg-c button { flex: 1; padding: 5px 8px; }
.sw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.swr { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); min-width: 0; cursor: pointer; }
.swr input[type="color"] { width: 26px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; flex: none; }
.swr input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
.swr input[type="color"]::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 6px; }
.swr .nm { font-size: 12px; line-height: 1.2; min-width: 0; }
.swr code { display: block; font: 11px "JetBrains Mono", monospace; color: var(--fg2); }
.rng { display: grid; grid-template-columns: 70px 1fr 34px; align-items: center; gap: 8px; font-size: 12px; color: var(--fg2); }
.rng input { width: 100%; accent-color: var(--fg); }
.rng output { text-align: right; font: 12px "JetBrains Mono", monospace; color: var(--fg); }
.note { font-size: 12px; color: var(--fg2); margin: 0; }
.ck { font-size: 12px; display: grid; gap: 3px; }
.ck div { display: flex; gap: 8px; }
.ck b { font-weight: 600; min-width: 46px; }
.ck .ok { color: var(--ok); } .ck .no { color: var(--no); }
.saved { display: grid; gap: 6px; }
.saved .it { display: flex; gap: 6px; align-items: center; }
.saved .it button:first-child { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
textarea { width: 100%; height: 160px; background: var(--bg); border: 1px solid var(--line); border-radius: 9px; padding: 8px; font: 11px/1.4 "JetBrains Mono", monospace; resize: vertical; }

/* ============ Widget: every rule reads theme tokens only ============ */
.w { width: 420px; height: 672px; position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 10px;
  background: var(--canvas-bg); color: var(--text); font-family: var(--f-body); font-size: 13px; line-height: 1.35; border-radius: calc(var(--r) + 8px);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 20px 40px -20px rgba(0,0,0,.4); }
.w * { box-sizing: border-box; }
.w svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.w-body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }

/* Surfaces */
.crd { background: var(--surf-bg); backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur); box-shadow: var(--sh-raise); border-radius: var(--r); color: var(--text); flex: none; position: relative; min-width: 0; }
.well { background: var(--sunken); box-shadow: var(--sh-carve); outline: var(--sunken-bd); outline-offset: -1px; color: var(--sunken-tx); border-radius: var(--r-sm); }
.pad { padding: 12px 14px; }
.gt { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--canvas-tx); margin: 2px 6px -4px; flex: none; }
.row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-width: 0; }
.row.sep { border-top: 1px solid var(--line-c); }
.grow { flex: 1; min-width: 0; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm { font-weight: 600; }
.sub { font-size: 11.5px; color: var(--muted); }
.t2 { color: var(--tx2); }
.mono { font-family: var(--f-mono); font-size: 11.5px; }
.disp { font-family: var(--f-display); font-weight: var(--w-display); letter-spacing: var(--ls-display); }
.big { font-size: 30px; line-height: 1; }
.md { font-size: 20px; line-height: 1.1; }

/* Header and nav */
.w-hd { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
.w-hd .title { font-size: 17px; line-height: 1.1; }
.ib { width: 30px; height: 30px; display: grid; place-items: center; border-radius: var(--r-sm); color: var(--muted); }
.ib.on { background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-glow); }
.w-nav { display: flex; gap: 6px; padding: 6px; }
.ni { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 4px; border-radius: var(--r-sm); color: var(--muted); font-weight: 500; }
.ni.act { background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-glow); font-weight: 600; }

/* Fields, buttons, segmented control */
.fld { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; flex: none; color: var(--sunken-muted); }
.srow .fld { flex: 1; }
.srow { display: flex; gap: 8px; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: var(--r-sm); background: var(--surf-bg); box-shadow: var(--sh-raise); color: var(--text); font-weight: 500; flex: none; }
.btn.pri { background: var(--accent); color: var(--on-accent); box-shadow: var(--sh-raise), var(--sh-glow); }
.seg { display: flex; padding: 4px; gap: 4px; flex: none; }
.seg span { flex: 1; text-align: center; padding: 6px 4px; border-radius: calc(var(--r-sm) - 3px); color: var(--sunken-muted); font-size: 12px; white-space: nowrap; }
.seg span.on { background: var(--accent); color: var(--on-accent); font-weight: 600; box-shadow: var(--sh-glow); }

/* Toggle: three variants, chosen by a class on .w */
.tg { position: relative; width: 40px; height: 24px; border-radius: 12px; flex: none; }
.tg i { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; transition: left .15s; }
.tg.on i { left: 19px; }
.tg.sm { width: 32px; height: 19px; } .tg.sm i { width: 13px; height: 13px; } .tg.sm.on i { left: 16px; }
.tg.dis { opacity: .45; }
.tg.tv-channel { background: var(--sunken); box-shadow: var(--sh-carve); outline: var(--sunken-bd); outline-offset: -1px; }
.tg.tv-channel.on { background: var(--accent); box-shadow: inset 2px 2px 4px rgba(0,0,0,.3), var(--sh-glow); }
.tg.tv-channel i { background: var(--knob); box-shadow: 0 2px 4px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25); }
.tg.tv-pill { background: var(--track); }
.tg.tv-pill.on { background: var(--accent); box-shadow: var(--sh-glow); }
.tg.tv-pill i { background: #ffffff; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.tg.tv-square { border-radius: 6px; background: var(--sunken); box-shadow: var(--sh-carve); outline: var(--sunken-bd); outline-offset: -1px; }
.tg.tv-square i { border-radius: 4px; background: var(--muted); }
.tg.tv-square.on i { background: var(--accent); box-shadow: var(--sh-glow); }

/* Variants of title bar, nav, field, segmented control, bar and pill */
.ibs { display: flex; gap: 2px; padding: 3px; }
.ibs .ib { width: 28px; height: 28px; color: var(--sunken-muted); }
.w-hd.hd-float { padding: 2px 4px; }
.hd-float .title, .hd-float .sub { color: var(--canvas-tx); }
.hd-float .ib { background: var(--surf-bg); box-shadow: var(--sh-raise-sm); border-radius: 50%; color: var(--text); }
.hd-float .ib.on { background: var(--accent); color: var(--on-accent); }
.nav-well .ni { color: var(--sunken-muted); }
.nav-well .ni.act { background: var(--surf-bg); color: var(--text); box-shadow: var(--sh-raise-sm); }
.nav-well .ni.act svg { color: var(--accent); }
.nav-line .ni { position: relative; }
.nav-line .ni.act { background: none; box-shadow: none; color: var(--text); }
.nav-line .ni.act::after { content: ""; position: absolute; left: 24%; right: 24%; bottom: 1px; height: 3px; border-radius: 2px; background: var(--accent); box-shadow: var(--sh-glow); }
.fld.fv-raised { background: var(--surf-bg); box-shadow: var(--sh-raise); color: var(--muted); border-radius: var(--r-sm); }
.fld.fv-line { border-bottom: 2px solid var(--track); color: var(--canvas-tx); padding: 0 4px; }
.seg.seg-chips { padding: 0; gap: 6px; }
.seg-chips span { background: var(--surf-bg); box-shadow: var(--sh-raise-sm); color: var(--text); border-radius: 999px; }
.seg-chips span.on { background: var(--accent); color: var(--on-accent); }
.pb.pb-thin { height: 4px; background: var(--dim); border-radius: 2px; }
.pbk { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; height: 8px; }
.pbk i { border-radius: 2px; background: var(--dim); }
.pbk.pbk-dots { grid-template-columns: repeat(16, 1fr); height: auto; gap: 4px; }
.pbk.pbk-dots i { border-radius: 50%; aspect-ratio: 1; }
.pbk i.lit { background: var(--bc, var(--accent)); box-shadow: 0 0 calc(var(--glow-k) * 6px) var(--bc, var(--accent-glow)); }
.pill.pv-outline { background: transparent; border-color: var(--st); }
.pill { width: 78px; justify-content: center; box-sizing: border-box; flex: none; }
.pill.pv-dot { background: none; border: 0; padding: 0; justify-content: flex-start; }

/* Ring: three variants */
.ring { position: relative; flex: none; display: grid; place-items: center; }
.ring .rc { position: relative; z-index: 3; text-align: center; display: grid; place-items: center; }
.dial { border-radius: 50%; background: var(--sunken); box-shadow: var(--sh-carve); outline: var(--sunken-bd); outline-offset: -1px; }
.dial::after { content: ''; position: absolute; inset: 0; border-radius: 50%; box-shadow: var(--dsh, var(--sh-carve)); pointer-events: none; z-index: 1; }
.dial .fill { position: absolute; inset: var(--fi, 0px); border-radius: 50%; background: var(--g); -webkit-mask: radial-gradient(circle, transparent calc(50% - var(--th) - 3px), #000 calc(50% - var(--th) - 2.5px)); mask: radial-gradient(circle, transparent calc(50% - var(--th) - 3px), #000 calc(50% - var(--th) - 2.5px)); filter: drop-shadow(0 0 calc(var(--glow-k) * 8px) var(--accent-glow)); }
.dial .hole { position: absolute; inset: calc(var(--th) + var(--hg, 0px)); border-radius: 50%; background: var(--hole-bg); box-shadow: var(--hsh, var(--sh-raise-sm)); z-index: 2; }
.dots i { position: absolute; left: 50%; top: 50%; border-radius: 50%; }
.dots i.lit { box-shadow: 0 0 calc(var(--glow-k) * 7px) currentColor; }
.thin svg { position: absolute; inset: 0; width: 100% !important; height: 100% !important; transform: rotate(-90deg); }
.ri { color: var(--tx2); display: grid; place-items: center; }
.ico { width: 34px; height: 34px; display: grid; place-items: center; flex: none; border-radius: var(--r-sm); }

/* Bar, pill, legend */
.pb { height: 8px; border-radius: 4px; position: relative; overflow: hidden; }
.pb > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--bc, var(--accent)); box-shadow: 0 0 calc(var(--glow-k) * 8px) var(--bc, var(--accent-glow)); }
.src-card > .row:first-child { background: var(--head-tint); border-radius: var(--r) var(--r) 0 0; }
.well.pb > i { box-shadow: var(--sh-fill), 0 0 calc(var(--glow-k) * 8px) var(--bc, var(--accent-glow)); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: var(--st); background: color-mix(in srgb, var(--st) 14%, transparent); border: 1px solid color-mix(in srgb, var(--st) 40%, transparent); white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--st); }
.lg { display: grid; gap: 7px; }
.lgr { display: flex; align-items: center; gap: 8px; }
.lgd { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 calc(var(--glow-k) * 6px) currentColor; }
.lgr b { font-family: var(--f-display); font-weight: var(--w-display); font-size: 15px; }

/* Layout helpers */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: none; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; flex: none; }
.span2 { grid-column: span 2; }
.tile { padding: 12px; display: grid; gap: 6px; align-content: start; }
.tile .top { display: flex; justify-content: space-between; align-items: center; }
.met { padding: 10px 12px; }
.met .v { margin-top: 2px; }
.chart { display: grid; gap: 4px; }
.chart.dotc { grid-template-columns: repeat(24, 1fr); }
.chart.dotc i { aspect-ratio: 1; border-radius: 50%; background: var(--dim); }
.chart.dotc i.lit { background: var(--accent); box-shadow: 0 0 calc(var(--glow-k) * 5px) var(--accent-glow); }
.chart.barc { grid-auto-flow: column; align-items: end; height: 58px; grid-auto-columns: 1fr; gap: 3px; }
.chart.barc i { border-radius: 3px 3px 1px 1px; background: var(--accent); box-shadow: 0 0 calc(var(--glow-k) * 6px) var(--accent-glow); }
pre.mono { margin: 0; padding: 12px; white-space: pre-wrap; word-break: break-all; color: var(--sunken-tx); }
.back { display: flex; align-items: center; gap: 4px; color: var(--canvas-tx); font-weight: 600; padding: 2px 4px; flex: none; }
.ev .l1 { display: flex; gap: 8px; align-items: baseline; }
.ev .l3 { display: flex; gap: 8px; align-items: center; margin-top: 4px; min-width: 0; }
.ev .l3 .ell { min-width: 0; flex: 1; }
.tl { position: relative; display: grid; gap: 8px; padding-left: 22px; flex: none; }
.tl::before { content: ""; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--sunken); box-shadow: var(--sh-carve); }
.tl > div { min-width: 0; }
.tl.tl-rings { padding-left: 40px; }
.tl.tl-rings::before { left: 14px; }
.tl .tnode { position: absolute; left: -40px; top: 50%; transform: translateY(-50%); line-height: 0; border-radius: 50%; background: var(--canvas-solid); box-shadow: 0 0 0 3px var(--canvas-solid); }
.tl .node { position: absolute; left: -20px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; border-radius: 50%; background: var(--st); box-shadow: 0 0 0 3px var(--canvas-solid), 0 0 calc(var(--glow-k) * 8px) var(--st); }
.kv { display: flex; align-items: center; gap: 10px; padding: 9px 12px; }
.kv + .kv { border-top: 1px solid var(--line-c); }
.kv .k { flex: 1; color: var(--tx2); }

/* Tabs */
.tabs { display: flex; gap: 6px; margin: 0 0 16px; }
.tabs button { padding: 8px 16px; border-radius: 999px; font-weight: 600; }

/* Design system catalog: page colors for the frame; theme tokens only inside .stage */
.ds-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
.ds-bar .f { width: 220px; }
.ds { display: grid; gap: 14px; color: var(--fg); }
.ds-sec { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.ds-h { font-size: 22px; font-weight: 700; line-height: 1.15; }
.ds-h2 { font-size: 15px; font-weight: 700; margin-top: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--fg); }
.ds-p { font-size: 13px; color: var(--fg2); max-width: 80ch; }
.ds-s { font-size: 12px; color: var(--fg2); }
.ds-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.ds-scroll { overflow-x: auto; }
.ds-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ds-tbl th { text-align: left; font-weight: 600; color: var(--fg2); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.ds-tbl td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.ds-tbl tr:last-child td { border-bottom: 0; }
.sw2 { display: inline-block; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); vertical-align: middle; }
.tok { font: 11px "JetBrains Mono", monospace; padding: 1px 6px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); color: var(--fg); white-space: nowrap; display: inline-block; }
.tok.ref { background: transparent; border-style: dashed; }
.val { font: 10.5px "JetBrains Mono", monospace; color: var(--fg2); word-break: break-word; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.fxbar { display: block; height: 6px; border-radius: 3px; background: var(--bg); border: 1px solid var(--line); overflow: hidden; }
.fxbar i { display: block; height: 100%; background: var(--fg); }
/* Stage: a piece of the widget canvas with the theme tokens */
.stage { background: var(--canvas-bg); color: var(--canvas-tx); font-family: var(--f-body); font-size: 13px; line-height: 1.35; border-radius: 14px; padding: 18px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border: 1px solid var(--line); }
.stage.sm { padding: 8px; border-radius: 10px; display: inline-flex; }
.stage.surf { background: var(--surface-solid); color: var(--text); }
.stage svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.prev { width: 72px; height: 42px; border-radius: var(--r-sm); display: grid; place-items: center; font-size: 11px; }
.cmp { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-top: 1px solid var(--line); }
.ds-h2 + div > .cmp:first-child { border-top: 0; }

function usage() {
  const cols = [];
  for (const [p, pl] of [['home', 'Home'], ['inbox', 'Inbox'], ['detail', 'Detail']]) for (const [l, ll] of LAYOUTS) cols.push([pl, ll.split(' ')[0], Header(p) + PAGE_FN[p](l) + Nav(p)]);
  cols.push(['Settings', 'All', Header('settings') + PAGE_FN.settings() + Nav('settings')]);
  return cols;
}

function dsPage() {

  const sec = (id, title, intro, body) => `<section class="ds-sec"><div id="ds-${id}" class="ds-h">${title}</div>${intro ? `<div class="ds-p">${intro}</div>` : ''}${body}</section>`;

  const fonts = `<div class="ds-cols">${['display', 'body', 'mono'].map(r => {

      <div style="font-family:${css}">0123456789 · Aa Bb Cc · 21:24:04</div></div>`;
  }).join('')}</div>`;
  const scale = `<div class="ds-scroll"><table class="ds-tbl"><thead><tr><th>Style</th><th>Use</th><th>Font</th><th>Size</th><th>Sample</th></tr></thead><tbody>
    ${TYPE_SCALE.map(([c, u, fnt, sz, fn, onCanvas]) => `<tr><td>${tok(c)}</td><td>${u}</td><td class="ds-s">${fnt}</td><td class="val">${sz}</td><td><span class="stage sm ${onCanvas ? '' : 'surf'}">${fn()}</span></td></tr>`).join('')}</tbody></table></div>`;
  const fx = `<div class="ds-scroll"><table class="ds-tbl"><thead><tr><th>Setting</th><th>Value</th><th style="width:30%"></th><th>Drives</th></tr></thead><tbody>

  const groups = [...new Set(COMPS.map(c => c.g))];
  const comps = groups.map(g => `<div class="ds-h2">${g}</div><div>${COMPS.filter(c => c.g === g).map(c => {
    const opts = c.v ? COMP_KEYS.find(x => x[0] === c.v)[2] : null;
    const gal = opts
      ? opts.map(([v, l]) => { const on = th.comp[c.v] === v; return `<div class="pick ${on ? 'sel' : ''}" role="button" tabindex="0" aria-pressed="${on}" data-act="compv" data-k="${c.v}" data-v="${v}"><div class="stage">${withC(c.v, v, c.demo)}</div><span class="lbl">${l}${on ? ' · in use' : ''}</span></div>`; }).join('')

  const name = th.themeId === 'custom' ? 'Custom theme' : THEMES[th.themeId].name;
  const toc = [['colors', 'Color tokens'], ['derived', 'Made tokens'], ['type', 'Type'], ['fx', 'Depth and effects'], ['comps', 'Components'], ['matrix', 'Where used']];

  return `<div class="ds-bar">${sel('Theme', 'theme', ent(THEMES), th.themeId, true)}${sel('Mode', 'dsmode', [['light', 'Light'], ['dark', 'Dark']], mode)}
      <p class="note" style="flex:1;min-width:220px">The catalog uses the current Studio theme, with your edits. A click on a variant selects it for all screens.</p></div>
    <div class="ds" style="${styleOf(t)}">

        <div class="toc">${toc.map(([id, l]) => `<a href="#ds-${id}">${l}</a>`).join('')}</div></section>

      ${sec('type', 'Type', 'Three font tokens. Every text style uses one of them.', fonts + scale)}
      ${sec('fx', 'Depth and effects', 'Six numbers make all shadows, glows, glass and corners.', fx)}
      ${sec('comps', 'Components', 'Each component reads only tokens. Variants show side by side. The outlined one is in use.', comps)}
      ${sec('matrix', 'Where used', 'Which components make each screen, for each page and layout.', matrix)}
    </div>`;
}

/* ================= Contrast checks ================= */
function checks(th, mode) {
  const p = th.pal[mode], s = tokens(th, mode)._surfEff;
  return [
    ['Text on surface', p.text, s, 4.5], ['Muted on surface', p.muted, s, 4.5], ['Canvas text', p.canvasTx, p.canvas, 4.5],
    ['Sunken text', p.sunkenTx, p.sunken, 4.5], ['On accent', p.onAccent, p.accent, 4.5],
    ['Accent on surface (UI)', p.accent, s, 3],
    ...['done', 'pending', 'failed', 'new'].map(k => [`${k[0].toUpperCase() + k.slice(1)} on surface`, p[k], s, 4.5]),
  ].map(([n, a, b, min]) => [n, ratio(a, b), min]);
}

/* ================= Studio state ================= */
const KEY = 'runner-studio-2';
let state;
try { state = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { state = null; }
if (state && !PAGES.some(x => x[0] === state.page)) state.page = 'home';
if (state && state.th && state.th.comp) { state.th.comp = { ...COMP_DEFAULT, ...state.th.comp }; if (state.th.comp.bar === 'blocks') { state.th.comp.bar = 'carved'; state.th.comp.meter = 'blocks'; } if (state.th.comp.list === 'timeline') { state.th.comp.list = 'cards'; state.th.comp.inboxView = 'timeline'; } }
if (!state || !state.th || !state.th.pal || !state.th.pal.light) state = { page: 'home', mode: 'light', edit: 'light', open: { view: true, theme: true }, th: fromTheme('dotDepth') };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
const opt = (list, cur, custom) => (custom ? `<option value="custom"${cur === 'custom' ? ' selected' : ''}>Custom</option>` : '') + list.map(([v, l]) => `<option value="${v}"${cur === v ? ' selected' : ''}>${l}</option>`).join('');
const sel = (label, act, list, cur, custom) => `<label class="f"><span>${label}</span><select data-act="${act}">${opt(list, cur, custom)}</select></label>`;
const ent = o => Object.entries(o).map(([k, v]) => [k, v.name]);

let SAVED = {}, db = null;
function controls() {
  const th = state.th, s = state, ed = s.edit;
  const sec = (id, title, hint, body) => `<details class="sec" data-sec="${id}"${s.open[id] ? ' open' : ''}><summary>${title}<span class="hint">${hint}</span></summary><div class="sec-b">${body}</div></details>`;
  return sec('view', 'View', `${PAGES.find(x => x[0] === s.page)[1].split(' (')[0]} · ${s.mode}`, `
      ${sel('Page', 'page', PAGES, s.page)}
      <div class="two">${sel('Mode', 'mode', [['light', 'Light'], ['dark', 'Dark'], ['both', 'Both']], s.mode)}${sel('Layout', 'layout', LAYOUTS, th.layout)}</div>
      ${sel('Inbox list', 'comp:inboxView', COMP_KEYS.find(x => x[0] === 'inboxView')[2], th.comp.inboxView)}`)
    + sec('theme', 'Theme preset', th.themeId === 'custom' ? 'Custom' : THEMES[th.themeId].name, `
      ${sel('Start from', 'theme', ent(THEMES), th.themeId, true)}
      <p class="note">A theme sets all the layers below. A change to one layer makes the theme "Custom".</p>`)
    + sec('pal', 'Palette', th.palId === 'custom' ? 'Custom' : PALS[th.palId].name, `
      ${sel('Palette preset', 'pal', ent(PALS), th.palId, true)}
      <div class="f"><span>Edit colors for</span><div class="seg-c">${['light', 'dark'].map(m => `<button type="button" data-act="edit" data-v="${m}" class="${ed === m ? 'on' : ''}">${m === 'light' ? 'Light' : 'Dark'}</button>`).join('')}</div></div>
      <div class="sw-grid">${PAL_KEYS.map(([k, l, d]) => `<label class="swr" title="${d}"><input type="color" data-tok="${k}" value="${th.pal[ed][k]}"><span class="nm">${l}<code>${th.pal[ed][k]}</code></span></label>`).join('')}</div>`)
    + sec('type', 'Type', th.typeId === 'custom' ? 'Custom' : TYPES[th.typeId].name, `
      ${sel('Type preset', 'typeP', ent(TYPES), th.typeId, true)}
      ${sel('Display: titles and big numbers', 'font:display', ent(FONTS), th.type.display)}
      ${sel('Body: all other text', 'font:body', ent(FONTS), th.type.body)}
      ${sel('Mono: ids, types, times, payload', 'font:mono', ent(FONTS), th.type.mono)}`)
    + sec('fx', 'Depth and effects', th.fxId === 'custom' ? 'Custom' : FXS[th.fxId].name, `
      ${sel('Effects preset', 'fxP', ent(FXS), th.fxId, true)}
      ${FX_KEYS.map(([k, l, a, b]) => `<label class="rng"><span>${l}</span><input type="range" min="${a}" max="${b}" value="${th.fx[k]}" data-fx="${k}"><output>${th.fx[k]}</output></label>`).join('')}
      <p class="note">Depth: drop shadow. Bevel: edge light. Carve: holes. Glow: light on the accent. Glass: see-through surfaces.</p>`)
    + sec('comp', 'Components', (COMP_KEYS.length - 1) + ' parts', `
      ${COMP_KEYS.filter(([k]) => k !== 'inboxView').map(([k, l, o]) => `<div class="f"><span>${l}</span><div class="seg-c wrap">${o.map(([v, n]) => `<button type="button" data-act="compv" data-k="${k}" data-v="${v}" class="${th.comp[k] === v ? 'on' : ''}">${n}</button>`).join('')}</div></div>`).join('')}
      <p class="note">The Design system tab shows each variant.</p>`)
    + sec('contrast', 'Contrast', '', `<div id="ck" class="ck"></div>`)
    + sec('saved', 'Saved themes', db ? Object.keys(SAVED).length + '' : '', db ? `
      <div class="seg-c"><input type="text" id="sv-name" placeholder="Name" maxlength="40"><button type="button" data-act="save">Save</button></div>
      <div class="saved" id="sv-list"></div>` : `<p class="note">Saving needs the claude.ai viewer.</p>`)
    + sec('export', 'Export tokens', 'CSS', `<button type="button" data-act="copy">Copy CSS variables</button><textarea id="ex" readonly></textarea>`);

function savedList() {
  const el = document.getElementById('sv-list'); if (!el) return;
  const items = Object.entries(SAVED).sort((a, b) => (b[1].at || '').localeCompare(a[1].at || ''));
  el.innerHTML = items.length ? items.map(([id, v]) => `<div class="it"><button type="button" data-load="${id}">${v.name.replace(/</g, '&lt;')}</button><button type="button" data-del="${id}" aria-label="Delete">✕</button></div>`).join('') : '<p class="note">No saved themes yet.</p>';
}
function exportCss() {
  const out = ['light', 'dark'].map(m => { const t = tokens(state.th, m); return `${m === 'light' ? ':root' : ':root[data-mode="dark"]'} {\n${Object.entries(t).filter(([k]) => k.startsWith('--')).map(([k, v]) => `  ${k}: ${v};`).join('\n')}\n}`; });
  return `/* ${state.th.themeId === 'custom' ? 'Custom theme' : THEMES[state.th.themeId].name} · layout ${state.th.layout} · ${COMP_KEYS.map(([k]) => k + ' ' + state.th.comp[k]).join(', ')} */\n` + out.join('\n\n');
}

/* ================= Render ================= */
const modes = () => state.mode === 'both' ? ['light', 'dark'] : [state.mode];
function heroZ() {
  const wide = innerWidth > 760, avail = (wide ? innerWidth - 32 - 400 - 20 : innerWidth - 32);
  const n = modes().length, h = Math.max(.5, Math.min(1, (innerHeight - 140) / 680));
  return Math.max(.35, Math.min(h, (avail - 16 * (n - 1)) / (420 * n))).toFixed(3);
}
function previews() {
  const th = state.th, ms = modes();
  const fig = (m, p, z) => `<figure><div class="zoom" style="--z:${z}">${widget(th, m, p)}</div><figcaption>${PAGES.find(x => x[0] === p)[1]}${ms.length > 1 ? ' · ' + m : ''}</figcaption></figure>`;
  document.getElementById('hero').innerHTML = ms.map(m => fig(m, state.page, heroZ())).join('');
  const sz = Math.max(.32, Math.min(.5, (document.getElementById('app').clientWidth - 60) / (4 * 420))).toFixed(3);
  document.getElementById('all').innerHTML = ms.map(m => `<div class="frames">${['home', 'inbox', 'detail', 'settings'].map(p => fig(m, p, sz)).join('')}</div>`).join('');
  const ck = document.getElementById('ck');
  if (ck) ck.innerHTML = ms.map(m => checks(th, m).map(([n, r, min]) => `<div><b class="${r >= min ? 'ok' : 'no'}">${r.toFixed(1)}:1</b><span>${ms.length > 1 ? m + ' · ' : ''}${n}${r >= min ? '' : ` (needs ${min}:1)`}</span></div>`).join('')).join('');
  const ex = document.getElementById('ex'); if (ex) ex.value = exportCss();
  fitCtls();
  save();
}
function fitCtls() {
  const hero = document.getElementById('hero'), c = document.getElementById('ctls');
  c.style.height = innerWidth > 760 ? Math.max(420, hero.offsetHeight - 24) + 'px' : '';
}
function render() {
  document.querySelectorAll('[data-tab]').forEach(b => { const on = (state.tab || 'studio') === b.dataset.tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  if (state.tab === 'ds') { document.getElementById('app').innerHTML = dsPage(); save(); return; }
  document.getElementById('app').innerHTML = `<div class="st-top"><div class="st-hero" id="hero"></div><div class="st-ctls" id="ctls">${controls()}</div></div><div class="st-all" id="all"></div>`;
  savedList();
  previews();
}
let raf = 0;
const soon = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(previews); };

/* ================= Events ================= */
const app = document.getElementById('app');
app.addEventListener('toggle', e => { const d = e.target.closest && e.target.closest('details.sec'); if (d) { state.open[d.dataset.sec] = d.open; save(); } }, true);
app.addEventListener('change', e => {
  const a = e.target.dataset.act; if (!a) return;
  const v = e.target.value, th = state.th;
  if (a === 'dsmode') state.dsMode = v;
  else if (a === 'page' || a === 'mode') { state[a] = v; if (a === 'mode' && v !== 'both') state.edit = v; }
  else if (a === 'layout') { th.layout = v; th.themeId = 'custom'; }
  else if (a === 'theme') { if (v !== 'custom') state.th = fromTheme(v); }
  else if (a === 'pal') { if (v !== 'custom') { th.pal = clone({ light: PALS[v].light, dark: PALS[v].dark }); th.palId = v; th.themeId = 'custom'; } }
  else if (a === 'typeP') { if (v !== 'custom') { const t = TYPES[v]; th.type = { display: t.display, body: t.body, mono: t.mono }; th.typeId = v; th.themeId = 'custom'; } }
  else if (a === 'fxP') { if (v !== 'custom') { th.fx = Object.fromEntries(FX_KEYS.map(([k]) => [k, FXS[v][k]])); th.fxId = v; th.themeId = 'custom'; } }
  else if (a.startsWith('font:')) { th.type[a.slice(5)] = v; th.typeId = 'custom'; th.themeId = 'custom'; }
  else if (a.startsWith('comp:')) { th.comp[a.slice(5)] = v; th.themeId = 'custom'; }
  render();
});
function markCustom(act) {
  for (const s of [act, 'theme']) { const el = app.querySelector(`select[data-act="${s}"]`); if (el) el.value = 'custom'; }
}
app.addEventListener('input', e => {
  const t = e.target, th = state.th;
  if (t.dataset.tok) {
    th.pal[state.edit][t.dataset.tok] = t.value; t.nextElementSibling.querySelector('code').textContent = t.value;
    if (th.palId !== 'custom') { th.palId = 'custom'; th.themeId = 'custom'; markCustom('pal'); }
    soon();
  } else if (t.dataset.fx) {
    th.fx[t.dataset.fx] = +t.value; t.nextElementSibling.textContent = t.value;
    if (th.fxId !== 'custom') { th.fxId = 'custom'; th.themeId = 'custom'; markCustom('fxP'); }
    soon();
  }
});
app.addEventListener('click', e => {
  const pk = e.target.closest('[data-act="compv"]');
  if (pk) { state.th.comp[pk.dataset.k] = pk.dataset.v; state.th.themeId = 'custom'; const y = scrollY; render(); scrollTo(0, y); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act === 'edit') { state.edit = b.dataset.v; render(); }
  else if (b.dataset.act === 'copy') {
    const ex = document.getElementById('ex'); ex.select();
    const done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy CSS variables'; }, 1500); };
    try { navigator.clipboard.writeText(ex.value).then(done, () => { document.execCommand('copy'); done(); }); } catch (x) { document.execCommand('copy'); done(); }
  } else if (b.dataset.act === 'save' && db) {
    const inp = document.getElementById('sv-name'), name = (inp.value || '').trim() || (state.th.themeId === 'custom' ? 'Custom' : THEMES[state.th.themeId].name);
    const id = 't' + Date.now().toString(36), doc = { name, at: new Date().toISOString(), th: clone(state.th) };
    SAVED[id] = doc; inp.value = ''; savedList();
    db.collection('themes').doc(id).set(doc).catch(() => { delete SAVED[id]; savedList(); });
  } else if (b.dataset.load && SAVED[b.dataset.load]) { state.th = { ...clone(SAVED[b.dataset.load].th), themeId: 'custom' }; render(); }
  else if (b.dataset.del && db) { const id = b.dataset.del, old = SAVED[id]; delete SAVED[id]; savedList(); db.collection('themes').doc(id).delete().catch(() => { SAVED[id] = old; savedList(); }); }
});
app.addEventListener('keydown', e => { const pk = e.target.closest && e.target.closest('.pick[role="button"]'); if (pk && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pk.click(); } });
let rz = 0;
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (state.tab !== 'ds') previews(); }, 120); });
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) { state.tab = b.dataset.tab; render(); } });
render();
(async () => {
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db) return;
  render();
  db.collection('themes').onSnapshot(snap => {
    SAVED = {};
    snap.docs.forEach(d => { const x = d.data() || {}; if (x.th && x.th.pal && typeof x.name === 'string') SAVED[d.id] = x; });
    savedList();
    const h = document.querySelector('details[data-sec="saved"] .hint'); if (h) h.textContent = Object.keys(SAVED).length;
  }, () => {});
})();
</script>

</body></html>
